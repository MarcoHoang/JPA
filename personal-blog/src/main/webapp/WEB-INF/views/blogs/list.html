<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <title>Blog List</title>
    <link rel="stylesheet" href="/css/blog.css">

    <style>
        /* Gộp CSS bạn gửi trước đó */
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            background: #fff;
            padding: 25px 30px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        a {
            text-decoration: none;
            color: #007bff;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        a:hover {
            color: #0056b3;
        }

        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .search-form {
            display: flex;
            flex-grow: 1;
        }

        .search-form input {
            flex-grow: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px 0 0 4px;
        }

        .search-form button {
            padding: 8px 12px;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
        }

        .manage-category-button {
            background-color: #6c757d;
            color: white;
            padding: 9px 15px;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .manage-category-button:hover {
            background-color: #5a6268;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        table, th, td {
            border: 1px solid #ddd;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            color: #444;
        }

        th {
            background-color: #f0f0f0;
            font-weight: 700;
        }

        tbody tr:hover {
            background-color: #f9f9f9;
        }

        td a {
            margin-right: 8px;
        }

        #loadMoreBtn {
            display: block;
            margin: 30px auto 10px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #388e3c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #loadMoreBtn:hover {
            background-color: #2e7d32;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>All Blogs</h1>

    <div class="controls-bar">
        <a href="/categories" class="manage-category-button">⚙️ Manage Categories</a>
        <form id="searchForm" class="search-form">
            <input type="text" id="keyword" name="keyword" placeholder="Search by title..."/>
            <button type="submit">Search</button>
        </form>
    </div>

    <p>
        <a href="/blogs/create" class="create-link">➕ Create New Blog</a>
    </p>

    <table>
        <thead>
        <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Category</th>
            <th>Created At</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="blogList">
        <!-- Các bài viết sẽ được render thông qua AJAX -->
        </tbody>
    </table>

    <div id="pagination-controls">
        <button id="loadMoreBtn">⬇ Tải thêm bài viết</button>
    </div>
</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="/js/blog.js"></script>

</body>
</html>

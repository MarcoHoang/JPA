<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Delete Blog</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 80px auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #d9534f;
            text-align: center;
            margin-bottom: 25px;
        }

        p {
            font-size: 1.1em;
            text-align: center;
            color: #333;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        button, a {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
        }

        .confirm-btn {
            background-color: #d9534f;
            color: white;
        }

        .confirm-btn:hover {
            background-color: #c9302c;
        }

        .cancel-btn {
            background-color: #6c757d;
            color: white;
        }

        .cancel-btn:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Xác nhận xóa bài viết</h2>

    <p th:if="${blog != null}">
        Bạn có chắc chắn muốn xóa bài viết: <strong th:text="${blog.title}">Tiêu đề</strong>?
    </p>

    <form method="post" action="/blogs/delete">
        <input type="hidden" name="id" th:value="${blog.id}"/>
        <div class="actions">
            <button type="submit" class="confirm-btn">🗑 Xóa</button>
            <a href="/blogs" class="cancel-btn">↩ Quay lại</a>
        </div>
    </form>
</div>
</body>
</html>
